plugins { id 'com.android.application'; id 'com.google.gms.google-services' }

android { namespace 'com.thechaknapoint.customer'; compileSdk 35
    defaultConfig { applicationId 'com.thechaknapoint.customer'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0' }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
