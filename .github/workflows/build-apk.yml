name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Extract project
        run: |
          unzip -q The_Chakna_Point_READY_PRO*.zip -d project

      - name: Find project
        run: |
          find project -name settings.gradle -print

      - name: Fix SDK version
        run: |
          APP=$(find project -name build.gradle -path "*/app/build.gradle" | head -1)
          sed -i 's/compileSdkVersion 35/compileSdkVersion 30/g' "$APP"
          sed -i 's/target
