name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Extract project
        run: |
          unzip -q The_Chakna_Point_READY_PRO*.zip -d project

      - name: Fix Android SDK version
        run: |
          sed -i 's/compileSdkVersion 35/compileSdkVersion 30/g' project/The_Chakna_Point_ANDROIDIDE/app/build.gradle
          sed -i 's/targetSdkVersion 35/targetSdkVersion 30/g' project/The_Chakna_Point_ANDROIDIDE/app/build.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.1.1'

      - name: Build APK
        run: |
          cd project/The_Chakna_Point_ANDROIDIDE
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Chakna-Point-APK
          path: project/The_Chakna_Point_ANDROIDIDE/app/build/outputs/apk/debug/app-debug.apk
