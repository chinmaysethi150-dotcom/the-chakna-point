name: Setup Android Project

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -1)

          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP" -d extracted

          SETTINGS=$(find extracted -type f -name 'settings.gradle' -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          cp -a "$PROJECT_DIR"/. .

          rm -rf extracted
          rm -f "$ZIP"

      - name: Commit Android project
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Setup native Android project" || exit 0
          git push
