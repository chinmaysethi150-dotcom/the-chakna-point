name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Extract Android project
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'The_Chakna_Point_READY_PRO*.zip' | head -1)
          if [ -z "$ZIP" ]; then
            echo "READY_PRO ZIP not found"
            exit 1
          fi
          echo "Using: $ZIP"
          unzip -q "$ZIP" -d project

      - name: Fix Android project
        shell: bash
        run: |
          MANIFEST=$(find project -path '*/app/src/main/AndroidManifest.xml' | head -1)
          APP_GRADLE=$(find project -path '*/app/build.gradle' | head -1)

          if [ -z "$MANIFEST" ] || [ -z "$APP_GRADLE" ]; then
            echo "Android project files not found"
            exit 1
          fi

          python3 - "$MANIFEST" "$APP_GRADLE" <<'PY'
          import re, sys
          manifest, gradle = sys.argv[1], sys.argv[2]

          s = open(manifest, encoding="utf-8").read()
          if re.search(r'<manifest\b[^>]*\bpackage\s*=', s) is None:
              s = re.sub(r'<manifest\b', '<manifest package="com.thechaknapoint.customer"', s, count=1)
              open(manifest, "w", encoding="utf-8").write(s)

          g = open(gradle, encoding="utf-8").read()
          g = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 30', g)
          g = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 30', g)
          open(gradle, "w", encoding="utf-8").write(g)
          PY

      - name: Download Gradle 6.1.1
        shell: bash
        run: |
          curl -fL -o "$RUNNER_TEMP/gradle.zip"             https://services.gradle.org/distributions/gradle-6.1.1-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

      - name: Build APK
        shell: bash
        run: |
          export GRADLE_USER_HOME="$RUNNER_TEMP/gradle-home"
          mkdir -p "$GRADLE_USER_HOME"
          cd "$(find "$GITHUB_WORKSPACE/project" -name settings.gradle -print -quit | xargs dirname)"
          "$RUNNER_TEMP/gradle-6.1.1/bin/gradle" assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Chakna-Point-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
